<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Mario World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background-color: #000; overflow: hidden; touch-action: none; }
        #game-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'snes';
        EJS_gameName = 'Super Mario World';
        EJS_color = '#4caf50';
        EJS_startOnLoaded = true;
        EJS_fullscreenOnLoaded = true;
        EJS_browserMode = 'mobile';
        
        /* Enlace directo a la ROM de Super Mario World */
        EJS_gameUrl = 'https://raw.githubusercontent.com/retroarch-roms/snes-roms/main/Super%20Mario%20World%20(USA).sfc';
        
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
