<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario World</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'snes';
        EJS_gameName = 'Super Mario World';
        EJS_color = '#000000';
        EJS_startOnLoaded = true;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        /* Nombre del archivo de la ROM que acabas de subir dentro de esta misma carpeta */
        EJS_gameUrl = 'Super Mario World (USA) (1).sfc';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
